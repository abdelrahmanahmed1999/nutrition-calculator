<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة التغذية</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .page-title {
            font-weight: 700;
        }

        .main-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.07);
        }

        .nav-tabs .nav-link {
            font-weight: 600;
        }

        .result-card {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
            height: 100%;
        }

        .result-number {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .result-label {
            color: #666;
            font-size: .95rem;
        }

        .nutrition-table th {
            white-space: nowrap;
        }

        .nutrition-table td,
        .nutrition-table th {
            vertical-align: middle;
        }

        .note {
            font-size: .85rem;
            color: #777;
        }

        .missing {
            color: #999;
        }

        .nutrition-table input {
            min-width: 100px;
        }

        @media (max-width: 575.98px) {
            .container {
                padding-left: 12px;
                padding-right: 12px;
            }

            .result-number {
                font-size: 1.35rem;
            }

            .result-label {
                font-size: .85rem;
            }
        }
    </style>
</head>

<body>

<div class="container py-4">

    <div class="text-center mb-4">
        <h1 class="page-title">حاسبة السعرات والقيم الغذائية</h1>
        <p class="text-muted mb-0">احسب السعرات والبروتين والدهون والكارب حسب الكمية التي أكلتها</p>
    </div>

    <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">

        <li class="nav-item" role="presentation">
            <button class="nav-link active"
                    id="calculator-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#calculator"
                    type="button">
                الحسبة
            </button>
        </li>

        <li class="nav-item" role="presentation">
            <button class="nav-link"
                    id="nutritions-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#nutritions"
                    type="button">
                كل الأطعمة
            </button>
        </li>

    </ul>

    <div class="tab-content">

        <!-- ==================== Calculator ==================== -->

        <div class="tab-pane fade show active" id="calculator">

            <div class="card main-card p-4">

                <div class="row g-3">

                    <div class="col-12 col-md-4">

                        <label for="category" class="form-label fw-bold">
                            القسم
                        </label>

                        <select id="category" class="form-select">
                            <option value="">-- اختر القسم --</option>
                        </select>

                    </div>

                    <div class="col-12 col-md-4">

                        <label for="nutrition" class="form-label fw-bold">
                            المنتج
                        </label>

                        <select id="nutrition" class="form-select" disabled>
                            <option value="">-- اختر المنتج --</option>
                        </select>

                    </div>

                    <div class="col-12 col-md-4">

                        <label for="grams" class="form-label fw-bold">
                            الكمية بالجرام
                        </label>

                        <input
                            type="number"
                            id="grams"
                            class="form-control"
                            min="0"
                            step="0.1"
                            placeholder="مثال: 65"
                            disabled
                        >

                    </div>

                </div>

                <div id="nutritionNote" class="alert alert-info mt-4 d-none"></div>

                <hr class="my-4">

                <div class="row g-3">

                    <div class="col-6 col-lg-3">
                        <div class="card result-card p-3 text-center">
                            <div class="result-label">السعرات</div>
                            <div id="caloriesResult" class="result-number">0</div>
                            <small>سعر حراري</small>
                        </div>
                    </div>

                    <div class="col-6 col-lg-3">
                        <div class="card result-card p-3 text-center">
                            <div class="result-label">البروتين</div>
                            <div id="proteinResult" class="result-number">0</div>
                            <small>جرام</small>
                        </div>
                    </div>

                    <div class="col-6 col-lg-3">
                        <div class="card result-card p-3 text-center">
                            <div class="result-label">الدهون</div>
                            <div id="fatResult" class="result-number">0</div>
                            <small>جرام</small>
                        </div>
                    </div>

                    <div class="col-6 col-lg-3">
                        <div class="card result-card p-3 text-center">
                            <div class="result-label">الكارب</div>
                            <div id="carbsResult" class="result-number">0</div>
                            <small>جرام</small>
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <!-- ==================== All Foods ==================== -->

        <div class="tab-pane fade" id="nutritions">

            <div class="card main-card p-3 p-md-4">

                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

                    <h4 class="mb-0">
                        جميع الأطعمة
                    </h4>

                    <input
                        type="search"
                        id="searchNutrition"
                        class="form-control"
                        style="max-width: 300px;"
                        placeholder="بحث عن منتج..."
                    >

                    <button type="button" id="saveJsonButton" class="btn btn-success">
                        تنزيل nutrition.json
                    </button>

                </div>

                <div id="nutritionsTables"></div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

let nutritionsData = {};

const categorySelect = document.getElementById('category');
const nutritionSelect = document.getElementById('nutrition');
const gramsInput = document.getElementById('grams');

const caloriesResult = document.getElementById('caloriesResult');
const proteinResult = document.getElementById('proteinResult');
const fatResult = document.getElementById('fatResult');
const carbsResult = document.getElementById('carbsResult');

const nutritionNote = document.getElementById('nutritionNote');
const nutritionsTables = document.getElementById('nutritionsTables');
const searchNutrition = document.getElementById('searchNutrition');
const saveJsonButton = document.getElementById('saveJsonButton');


/*
|--------------------------------------------------------------------------
| Format Number
|--------------------------------------------------------------------------
*/

function formatNumber(value) {

    if (value === null || value === undefined) {
        return '<span class="missing">غير متوفر</span>';
    }

    return Number(value).toLocaleString('en-EG', {
        maximumFractionDigits: 2
    });
}

function escapeHtml(value) {

    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function readFoodRow(row) {

    const readNumber = selector => {
        const value = row.querySelector(selector).value.trim();
        return value === '' ? null : Number(value);
    };

    return {
        name: row.querySelector('.food-name').value.trim(),
        calories: readNumber('.food-calories'),
        protein: readNumber('.food-protein'),
        fat: readNumber('.food-fat'),
        carbs: readNumber('.food-carbs'),
        notes: row.querySelector('.food-notes').value.trim()
    };
}

function renderFoodRow(category, nutrition, index, editing = false) {

    const row = document.createElement('tr');
    row.dataset.category = category;
    row.dataset.index = index;

    if (editing) {
        row.innerHTML = `
            <td><input class="form-control food-name" value="${escapeHtml(nutrition.name)}" placeholder="اسم المنتج"></td>
            <td><input class="form-control food-calories" type="number" min="0" step="0.01" value="${nutrition.calories ?? ''}" placeholder="السعرات"></td>
            <td><input class="form-control food-protein" type="number" min="0" step="0.01" value="${nutrition.protein ?? ''}" placeholder="البروتين"></td>
            <td><input class="form-control food-fat" type="number" min="0" step="0.01" value="${nutrition.fat ?? ''}" placeholder="الدهون"></td>
            <td><input class="form-control food-carbs" type="number" min="0" step="0.01" value="${nutrition.carbs ?? ''}" placeholder="الكارب"></td>
            <td><input class="form-control food-notes" value="${escapeHtml(nutrition.notes)}" placeholder="ملاحظات"></td>
            <td class="text-nowrap">
                <button type="button" class="btn btn-sm btn-success save-food">حفظ</button>
                <button type="button" class="btn btn-sm btn-secondary cancel-food">إلغاء</button>
            </td>
        `;

        return row;
    }

    row.innerHTML = `
        <td class="fw-bold">${escapeHtml(nutrition.name)}</td>
        <td>${formatNumber(nutrition.calories)}</td>
        <td>${formatNumber(nutrition.protein)}</td>
        <td>${formatNumber(nutrition.fat)}</td>
        <td>${formatNumber(nutrition.carbs)}</td>
        <td>${nutrition.notes ? `<span class="note">${escapeHtml(nutrition.notes)}</span>` : '-'}</td>
        <td class="text-nowrap">
            <button type="button" class="btn btn-sm btn-outline-primary edit-food">تعديل</button>
            <button type="button" class="btn btn-sm btn-outline-danger delete-food">حذف</button>
        </td>
    `;

    return row;
}


/*
|--------------------------------------------------------------------------
| Reset Results
|--------------------------------------------------------------------------
*/

function resetResults() {

    caloriesResult.innerHTML = '0';
    proteinResult.innerHTML = '0';
    fatResult.innerHTML = '0';
    carbsResult.innerHTML = '0';

    nutritionNote.classList.add('d-none');
    nutritionNote.innerHTML = '';
}


/*
|--------------------------------------------------------------------------
| Load Categories
|--------------------------------------------------------------------------
*/

function loadCategories() {

    categorySelect.innerHTML =
        '<option value="">-- اختر القسم --</option>';

    Object.keys(nutritionsData).forEach(category => {

        const option = document.createElement('option');

        option.value = category;
        option.textContent = category;

        categorySelect.appendChild(option);

    });
}


/*
|--------------------------------------------------------------------------
| Load Foods
|--------------------------------------------------------------------------
*/

function loadFoods() {

    const category = categorySelect.value;

    nutritionSelect.innerHTML =
        '<option value="">-- اختر المنتج --</option>';

    resetResults();

    gramsInput.value = '';
    gramsInput.disabled = true;

    if (!category || !nutritionsData[category]) {

        nutritionSelect.disabled = true;

        return;
    }

    nutritionsData[category].forEach((nutrition, index) => {

        const option = document.createElement('option');

        option.value = index;
        option.textContent = nutrition.name;

        nutritionSelect.appendChild(option);

    });

    nutritionSelect.disabled = false;
}


/*
|--------------------------------------------------------------------------
| Get Selected Food
|--------------------------------------------------------------------------
*/

function getSelectedFood() {

    const category = categorySelect.value;
    const index = nutritionSelect.value;

    if (
        !category ||
        index === '' ||
        !nutritionsData[category] ||
        !nutritionsData[category][index]
    ) {
        return null;
    }

    return nutritionsData[category][index];
}


/*
|--------------------------------------------------------------------------
| Calculate
|--------------------------------------------------------------------------
*/

function calculate() {

    const nutrition = getSelectedFood();

    const grams = Number(gramsInput.value);

    resetResults();

    if (!nutrition || !grams || grams <= 0) {
        return;
    }

    function calculateValue(value) {

        if (value === null || value === undefined) {
            return null;
        }

        return value * grams / 100;
    }

    const calories = calculateValue(nutrition.calories);
    const protein = calculateValue(nutrition.protein);
    const fat = calculateValue(nutrition.fat);
    const carbs = calculateValue(nutrition.carbs);

    caloriesResult.innerHTML = formatNumber(calories);
    proteinResult.innerHTML = formatNumber(protein);
    fatResult.innerHTML = formatNumber(fat);
    carbsResult.innerHTML = formatNumber(carbs);

    if (nutrition.notes) {

        nutritionNote.classList.remove('d-none');

        nutritionNote.innerHTML =
            '<strong>ملاحظة:</strong> ' + nutrition.notes;

    }

}


/*
|--------------------------------------------------------------------------
| Category Change
|--------------------------------------------------------------------------
*/

categorySelect.addEventListener('change', function () {

    loadFoods();

});


/*
|--------------------------------------------------------------------------
| Food Change
|--------------------------------------------------------------------------
*/

nutritionSelect.addEventListener('change', function () {

    resetResults();

    gramsInput.value = '';

    if (getSelectedFood()) {

        gramsInput.disabled = false;
        gramsInput.focus();

    } else {

        gramsInput.disabled = true;

    }

});


/*
|--------------------------------------------------------------------------
| Grams Change
|--------------------------------------------------------------------------
*/

gramsInput.addEventListener('input', function () {

    calculate();

});


/*
|--------------------------------------------------------------------------
| Render All Foods
|--------------------------------------------------------------------------
*/

function renderNutritionsTable(search = '') {

    nutritionsTables.innerHTML = '';

    const normalizedSearch = search.trim().toLowerCase();

    Object.entries(nutritionsData).forEach(([category, nutritions]) => {

        const filteredFoods = nutritions.filter(nutrition => {

            return nutrition.name
                .toLowerCase()
                .includes(normalizedSearch);

        });

        const section = document.createElement('div');

        section.className = 'mb-5';

        section.innerHTML = `

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">
                ${category}
                </h5>
                <button type="button" class="btn btn-sm btn-primary add-food" data-category="${escapeHtml(category)}">
                    إضافة منتج جديد
                </button>
            </div>

            <div class="table-responsive">

                <table class="table table-bordered table-striped nutrition-table">

                    <thead class="table-light">

                        <tr>

                            <th>المنتج</th>

                            <th>السعرات / 100 جم</th>

                            <th>البروتين / 100 جم</th>

                            <th>الدهون / 100 جم</th>

                            <th>الكارب / 100 جم</th>

                            <th>ملاحظات</th>

                            <th>إجراءات</th>

                        </tr>

                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>
        `;

        const tbody = section.querySelector('tbody');

        filteredFoods.forEach(nutrition => {
            const index = nutritions.indexOf(nutrition);
            tbody.appendChild(renderFoodRow(category, nutrition, index));
        });

        nutritionsTables.appendChild(section);

    });

}

function updateFood(category, index, food) {

    if (!food.name) {
        alert('اسم المنتج مطلوب');
        return false;
    }

    nutritionsData[category][index] = food;
    loadCategories();
    loadFoods();
    renderNutritionsTable(searchNutrition.value);
    return true;
}

nutritionsTables.addEventListener('click', function (event) {

    const button = event.target.closest('button');

    if (!button) {
        return;
    }

    const category = button.dataset.category;

    if (button.classList.contains('add-food')) {
        const section = button.closest('.mb-5');
        const tbody = section.querySelector('tbody');
        const index = nutritionsData[category].length;
        const row = renderFoodRow(category, {}, index, true);
        tbody.appendChild(row);
        row.querySelector('.food-name').focus();
        return;
    }

    const row = button.closest('tr');
    const rowCategory = row.dataset.category;
    const index = Number(row.dataset.index);

    if (button.classList.contains('edit-food')) {
        const editingRow = renderFoodRow(rowCategory, nutritionsData[rowCategory][index], index, true);
        row.replaceWith(editingRow);
        editingRow.querySelector('.food-name').focus();
        return;
    }

    if (button.classList.contains('cancel-food')) {
        if (index < nutritionsData[rowCategory].length) {
            row.replaceWith(renderFoodRow(rowCategory, nutritionsData[rowCategory][index], index));
        } else {
            row.remove();
        }
        return;
    }

    if (button.classList.contains('save-food')) {
        const food = readFoodRow(row);

        if (index === nutritionsData[rowCategory].length) {
            if (!food.name) {
                alert('اسم المنتج مطلوب');
                return;
            }
            nutritionsData[rowCategory].push(food);
            loadCategories();
            loadFoods();
            renderNutritionsTable(searchNutrition.value);
            return;
        }

        updateFood(rowCategory, index, food);
        return;
    }

    if (button.classList.contains('delete-food')) {
        if (confirm('هل تريد حذف هذا المنتج؟')) {
            nutritionsData[rowCategory].splice(index, 1);
            loadCategories();
            loadFoods();
            renderNutritionsTable(searchNutrition.value);
        }
    }

});

async function saveNutritionJson() {

    const json = JSON.stringify({ categories: nutritionsData }, null, 2);

    const blob = new Blob([json], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'nutrition.json';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    alert('تم تنزيل nutrition.json. ارفع الملف الجديد إلى GitHub لاستبدال الملف القديم.');
}

saveJsonButton.addEventListener('click', function () {

    saveNutritionJson().catch(error => {
        console.error(error);
        alert('تعذر حفظ الملف. تأكد من السماح باختيار الملفات.');
    });

});


/*
|--------------------------------------------------------------------------
| Search
|--------------------------------------------------------------------------
*/

searchNutrition.addEventListener('input', function () {

    renderNutritionsTable(this.value);

});


/*
|--------------------------------------------------------------------------
| Load JSON
|--------------------------------------------------------------------------
*/

fetch('nutrition.json')

    .then(response => {

        if (!response.ok) {

            throw new Error('Cannot load nutritions.json');

        }

        return response.json();

    })

    .then(data => {

        nutritionsData = data.categories;

        loadCategories();

        renderNutritionsTable();

    })

    .catch(error => {

        console.error(error);

        nutritionsTables.innerHTML = `

            <div class="alert alert-danger">

                تعذر تحميل ملف <strong>nutrition.json</strong>.

                <br>

                تأكد أن الملف موجود بجانب ملف HTML وأن الصفحة تعمل من خلال
                <strong>Laravel / Apache / Live Server</strong> وليس مباشرة عن طريق
                <strong>file://</strong>.

            </div>

        `;

    });

</script>

</body>
</html>
